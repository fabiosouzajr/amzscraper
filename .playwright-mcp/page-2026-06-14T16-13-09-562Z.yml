      - generic [ref=e877]:
        - generic [ref=e880]:
          - heading "Descrição do produto" [level=2] [ref=e883]
          - paragraph [ref=e885]: TekBond adesivo instantaneo 793 Bico Antientupimento 20g. Adesivo a base de cianoacrilato de média viscosidade desenvolvido para colagens que necessitam de alta velocidade de cura em substratos de difícil adesão principalmente para materiais porosos. Adere diversos tipos de materiais, como compostos de borracha, EPDM, borracha nitrílica, neoprene, EVA e Viton. É um produto monocomponente e não requer mistura. O processo de cura inicia-se quando uma fina camada de adesivo é aplicada entre as superfícies entrando em contato com a umidade do ar atmosférico. É um adesivo multiuso, muito utilizado no setor moveleiro e no setor industrial.
